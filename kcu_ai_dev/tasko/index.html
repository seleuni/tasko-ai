<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Tasko - 모바일 투두</title>
    <meta name="description" content="심플하고 직관적인 모바일 할 일 관리(Todo) 애플리케이션" />
    <meta property="og:title" content="Tasko - 모바일 투두" />
    <meta property="og:description" content="심플하고 직관적인 모바일 할 일 관리(Todo) 애플리케이션" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- 첫 화면이 깜빡이지 않도록 저장된 화면 모드를 먼저 적용 -->
    <script>
      (function () {
        var mode = null;
        try { mode = localStorage.getItem('tasko-theme'); } catch (e) {}
        var dark = mode === 'dark';
        if (mode !== 'light' && mode !== 'dark') {
          dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        }
        if (dark) { document.documentElement.classList.add('dark'); }
      })();
    </script>
    <!-- Pretendard Font -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  </head>
  <body class="bg-[#1A1E29] min-h-screen text-[#212529] antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
